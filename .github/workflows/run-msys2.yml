name: run-msys2
on:
  workflow_dispatch:
    inputs:
      run:
        required: true
jobs:
  run:
    runs-on: windows-latest
    steps:
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
      - shell: msys2 {0}
        run: ${{ github.event.inputs.run }}
      - uses: actions/upload-artifact@v4
        with:
          path: ${{ github.workspace }}
          retention-days: 7
          compression-level: 0
