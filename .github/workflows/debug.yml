name: debug
on:
  workflow_dispatch:
    inputs:
      runs-on:
        type: choice
        options:
          - windows-latest
          - ubuntu-latest
jobs:
  debug:
    runs-on: ${{ github.event.inputs.runs-on }}
    steps:
      - uses: Warpbuilds/action-debugger@34d2917fee828844b66d2097f65b1d9df6ce303d  # v2
      - uses: actions/upload-artifact@v7
        with:
          path: ${{ github.workspace }}
          retention-days: 7
          compression-level: 0
